name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore

      - name: Build (Debug)
        run: dotnet build -c Debug --no-restore --tl:off

      - name: Build (Release)
        run: dotnet build -c Release --no-restore --tl:off

      - name: Test (Debug)
        run: dotnet run --project tests/FastiraChart.Tests -c Debug --no-build

      - name: Test (Release)
        run: dotnet run --project tests/FastiraChart.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/FastiraChart/FastiraChart.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
